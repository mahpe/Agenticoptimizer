cif_path = "cif_files/Cu3Au_mp-2258_icsd58431.cif"
[prep_params]
auto_prepare = true
max_cell_size = 20
sublattice_index = 0
occupancy_tolerance = 2.0
supercell_size = [1, 2, 3]

[relax_params]
symprec = 1.0e-3

# 24 swap sites cannot represent the CIF's nominal 0.8/0.2 ratio exactly.
# Use the nearest integer composition: 19/24 and 5/24.
[swap_params]
ratio = [0.7916666666666666, 0.20833333333333334]

[agent_params]
backend = "random"
max_iters = 200
max_swaps_per_step = 4
seed = 0
skill_path = "Skill.md"
