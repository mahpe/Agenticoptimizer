[ga_params]
num_gens = 9
pop_size = 20
random_seed = 0
out_dir = "runs/Cu3Au_123_ga_200"

[mc_params]
num_steps = 200
acceptance_rate = 0.3
seed = 0
out_dir = "runs/Cu3Au_123_mc_200"
