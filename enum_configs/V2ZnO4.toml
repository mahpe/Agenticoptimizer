cif_path = "cif_files/V2ZnO4_mp-18879_icsd24135.cif"
[prep_params]
auto_prepare = true
max_cell_size = 20
sublattice_index = 1
occupancy_tolerance = 2.0
supercell_size = [1, 1, 1]

[relax_params]
symprec = 1.0e-3

# 16 swap sites resolve the CIF's nominal 0.49/0.51 occupancy to 8/8.
[swap_params]
ratio = [0.5, 0.5]

[agent_params]
backend = "random"
max_iters = 200
max_swaps_per_step = 4
seed = 0
skill_path = "Skill.md"
out_dir = "runs/V2ZnO4_random_200"

[ga_params]
num_gens = 9
pop_size = 20
random_seed = 0
out_dir = "runs/V2ZnO4_ga_200"

[mc_params]
num_steps = 200
acceptance_rate = 0.3
seed = 0
out_dir = "runs/V2ZnO4_mc_200"
