# Copy to config.toml before using the legacy optimizer entry points.
# The 15 publication systems have their own enum_configs/*.toml.
cif_path = "cif_files/NaSbSe2_mp-1220879_icsd645014.cif"

[prep_params]
auto_prepare = true
max_cell_size = 20
sublattice_index = 0
occupancy_tolerance = 2.0
supercell_size = [1, 2, 2]

[relax_params]
calc_name = "TensorNet-MatPES-PBE-2025.2"
optimizer = "BFGS"
interval = 1
fmax = 0.02
max_steps = 500
relax_atoms = true
relax_cell = true
cell_filter = "FrechetCellFilter"
fix_symmetry = true
fix_atoms = false
symprec = 1.0e-3

[agent_params]
backend = "random"
max_iters = 200
max_swaps_per_step = 4
seed = 0
skill_path = "Skill.md"
out_dir = "runs/random_latest"

[ga_params]
num_gens = 9
pop_size = 20
random_seed = 0
out_dir = "runs/ga_latest"

[mc_params]
num_steps = 200
acceptance_rate = 0.3
seed = 0
out_dir = "runs/mc_latest"
